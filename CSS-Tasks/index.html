<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>CSS</title>
    <style>
        h1{
            background-color: black;
        }
        div{
            text-align: center;
            color: blueviolet;
            background-color: rgb(233, 166, 65);
            width: 150px;
        }
        #division-2{
            color: rgb(0, 255, 34);
            background-color: rgb(0, 47, 255);
            width: 200px;
        }
        .div3{
            color: black;
            background-color: aquamarine;
            width: 110px;
            height: 30px;
        }
        #div3{
            color: rgb(238, 232, 232);
            background-color: rgb(216, 8, 8);
        }
        *{
            text-align: center;
            background-color: antiquewhite;

        }
    </style>
</head>
<body>

COLOR OPTIONS <hr>
    <h1 style="color: red;">heading</h1>
    <h3 style="color:rgb(200,33,198);">new headings</h3>
    <h1 style="color: rgba(200,100,105,1);">heading</h1>
    <h3 style="color: #0065ff;">new headings</h3>
    <h1 style="color: hsl(200,50%,40%);">heading</h1>
    <h3 style="color: hsla(150,50%,40%,0.9);">new headings</h3>
    <hr>

    SELECTORS

    <div>
        Division 1
    </div>
    <div id="division-2">
        Div 2
    </div>
    <div class="div3" id="div3">
        Div 3
    </div>
</body>
</html>

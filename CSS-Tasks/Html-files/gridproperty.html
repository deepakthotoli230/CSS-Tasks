        .product{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 20px;
        }
        .card{
            padding: 30px;
            color: white;
            background:darkblue;
        }
        @media(max-width:900px){
            .produts{
                grid-template-columns: repeat(2,1fr);
            }
        }
        @media(min-width:600px){
            .products{
                grid-template-columns: 1fr;
            }
        }

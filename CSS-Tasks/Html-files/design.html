<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS-Files/design.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="step active">
                <div class="circle">1</div>
                <div class="text">
                    <span>STEP 1</span>
                    <h4>YOUR INFO</h4>
                </div>
            </div>
            <div class="step">
                <div class="circle">2</div>
                <div class="text">
                    <span>STEP 2</span>
                    <h4>SELECT PLAN</h4>
                </div>
            </div>
            <div class="step">
                <div class="circle">3</div>
                <div class="text">
                    <span>STEP 3</span>
                    <h4>ADD-ONS</h4>
                </div>
            </div>
            <div class="step">
                <div class="circle">4</div>
                <div class="text">
                    <span>STEP 4</span>
                    <h4>SUMMARY</h4>
                </div>
            </div>
        </aside>
                <main class="content">
                    <div class="form">
                        <h1>Personal Info</h1>
                        <p>Pleaseprovide your name,email address,mobile number</p>
                        <div class="input-group"></div>
                        <label>Name</label>
                        <input type="text" placeholder="Arjun">
                    </div>
                    <div class="input-group"></div>
                        <label>Email</label>
                        <input type="text" placeholder="arjun123@gmail.com">
                    </div>
                    <div class="input-group"></div>
                        <label>Phone Number</label>
                        <input type="text" placeholder="+1 234 567 890">
                    </div>
                </div>
                <div class="buttons">
                    <button>Next Step</button>
                </div>    
                </main>
           
    </div>
</body>
</html>
